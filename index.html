<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5d52">
<title>나만의 영단어장</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a27; --sub:#6b746f; --line:#e4dfd3;
    --green:#1f5d52; --green-soft:#e3efe9; --accent:#c8572f; --gold:#e9d873;
    --hide:#d9e4de; --syn:#7a4fa0; --syn-soft:#f1eaf7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(90px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
  button{font-family:inherit;cursor:pointer}
  header{background:var(--green);color:#fff;padding:18px 18px 14px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  header h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.3px}
  header h1 span{color:var(--gold)}
  .hbtns{display:flex;gap:6px}
  .add{border:0;background:var(--gold);color:var(--green);font-weight:900;font-size:14px;border-radius:12px;padding:9px 12px;white-space:nowrap}
  .gear{border:0;background:rgba(255,255,255,.15);color:#fff;font-size:16px;border-radius:12px;padding:8px 10px}
  .stats{font-size:12.5px;opacity:.85;margin-top:3px}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:700}
  .chip.on{background:var(--gold);border-color:var(--gold);color:var(--green)}
  .tools{display:flex;gap:8px;padding:14px 14px 4px;flex-wrap:wrap}
  .tool{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:500;color:var(--ink)}
  .tool.on{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
  .tool.danger{color:#a33}
  main{padding:8px 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;margin:12px 0;box-shadow:0 2px 0 rgba(0,0,0,.03)}
  .card.done{opacity:.55}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .num{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 6px;display:inline-block;margin-bottom:4px}
  .word{font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1.15;word-break:break-word}
  .ph{font-size:14px;color:var(--sub);margin-top:2px;font-family:'Times New Roman',serif}
  .check{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;font-size:12.5px;color:var(--sub)}
  .check.on{background:var(--green);border-color:var(--green);color:#fff}
  .mean{margin-top:10px;font-size:17px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pos{flex:none;background:#6b4f9e;color:#fff;border-radius:50%;min-width:22px;height:22px;padding:0 4px;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
  .hid{position:relative;cursor:pointer;border-radius:8px;transition:.15s}
  .test .hid.cover{color:transparent;background:var(--hide);user-select:none}
  .test .hid.cover::after{content:'터치';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--green);opacity:.7}
  .test .hid{padding:1px 6px;margin:-1px -6px}
  .ex{margin-top:12px;padding:10px 12px;background:#f7f4ec;border-radius:12px;font-size:14.5px;line-height:1.5}
  .ex b{color:var(--accent);font-weight:700}
  .ex .ko{color:var(--sub);font-size:13px;margin-top:4px;display:block}
  .sec{margin-top:12px}
  .sec h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.5px;color:var(--sub);font-weight:700}
  .row{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px dashed var(--line);font-size:14.5px}
  .row:first-of-type{border-top:0}
  .row .w{font-weight:700;min-width:112px;flex:none}
  .row .m{color:#3c4743}
  .syn .w{color:var(--syn)}
  .synbox{background:var(--syn-soft);border-radius:12px;padding:6px 12px}
  .synbox .row{border-top-color:#ddd0ea}
  .badge{display:inline-block;background:var(--syn);color:#fff;font-size:10.5px;border-radius:5px;padding:0 5px;margin-right:4px;vertical-align:1px}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(244,241,234,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;gap:8px;z-index:6}
  .mode{flex:1;border-radius:14px;padding:13px;font-size:15px;font-weight:700;background:#fff;color:var(--sub);border:1px solid var(--line)}
  .mode.on{background:var(--green);color:#fff;border-color:var(--green)}
  .empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14px;line-height:1.6}
  .hint{font-size:12.5px;color:var(--sub);padding:2px 16px}

  .sheet-bg{position:fixed;inset:0;background:rgba(20,30,27,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.open{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .sheet h2{margin:0 0 4px;font-size:18px}
  .sheet p.s{margin:0 0 12px;color:var(--sub);font-size:13px;line-height:1.55}
  textarea{width:100%;min-height:160px;font:inherit;font-size:13px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;resize:vertical}
  .field{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
  .field label{font-size:13px;font-weight:700;flex:none}
  .field input{flex:1;font:inherit;font-size:15px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fff}
  .pv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:flex-start}
  .pv .t{flex:1;font-size:13px;color:var(--sub);line-height:1.45}
  .pv .t b{font-size:16px;color:var(--ink)}
  .pv .x{border:0;background:#f0e3de;color:#a33;border-radius:10px;padding:6px 10px;font-size:13px;flex:none}
  .btns{display:flex;gap:8px;margin-top:14px}
  .btn{flex:1;border-radius:14px;padding:13px;font-size:15px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .btn.pri{background:var(--green);color:#fff;border-color:var(--green)}
  .btn:disabled{opacity:.5}
  .menu .btn{display:block;width:100%;text-align:left;margin:8px 0;font-weight:500}
  .err{color:#a33;font-size:13px;margin-top:8px;min-height:1em}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#22302c;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <h1>나만의 <span>영단어장</span></h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="hbtns">
      <button class="add" id="addBtn">➕ 단어 추가</button>
      <button class="gear" id="menuBtn" aria-label="설정">⚙️</button>
    </div>
  </div>
  <div class="chips" id="days"></div>
</header>

<div class="tools" id="tools"></div>
<div class="hint" id="hint"></div>
<main id="list"></main>

<div class="bar">
  <button class="mode" data-mode="study">📖 공부 모드</button>
  <button class="mode" data-mode="test">✏️ 시험 모드</button>
</div>

<input type="file" id="file" accept=".json,.txt,application/json,text/plain" hidden>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== 처음 설치했을 때 들어 있는 단어 (DAY 04) ===== */
const STARTER = { day: "DAY 04", words: [
  { no:"0151", word:"complement", ph:"[kámpləmənt]", pos:"동", mean:"보충하다",
    ex:"Instead, their fluid movements <b>complement</b> one another.", exKo:"대신에, 그들의 유연한 동작들은 서로 보완합니다.",
    derived:[["compliment","칭찬, 감사, 칭찬하다"]], syn:[["make up for","보상하다, 보충하다"],["replenish","보충하다, 보급하다, 다시 채우다"]] },
  { no:"0152", word:"absorb", ph:"[əbsɔ́ːrb]", pos:"동", mean:"흡수하다, 받아들이다",
    ex:"Black walls <b>absorb</b> a lot of heat during the day.", exKo:"검은 벽은 낮 동안에 많은 열을 흡수한다.",
    derived:[["absorption","흡수, 통합, 몰두"],["absorbed","~에 빠져 있는, 몰두한 (be absorbed in)"]], syn:[["assimilate","동화시키다, 흡수하다"],["take in","섭취하다, 받아들이다"]] },
  { no:"0153", word:"sympathize", ph:"[símpəθàiz]", pos:"동", mean:"동정하다, 공감하다",
    ex:"I find it very hard to <b>sympathize</b> with him.", exKo:"나는 그를 동정하기가 몹시 힘들다.",
    derived:[["empathize","공감하다"],["sympathy","동정, 연민, 공감"]], syn:[] },
  { no:"0154", word:"tend", ph:"[tend]", pos:"동", mean:"경향이 있다 (to ®), ~하기 쉽다, 돌보다",
    ex:"Galaxies <b>tend</b> to clump together in clusters.", exKo:"은하계의 별들은 성단을 이루어 모이는 경향이 있다.",
    derived:[["tendency","성향, 기질, 동향"]], syn:[["be apt to ®","~하는 경향이 있다, ~하기 쉽다"]] },
  { no:"0155", word:"transform", ph:"[trænsfɔ́ːrm]", pos:"동", mean:"변형시키다",
    ex:"The photochemical reactions <b>transform</b> the light into electrical impulses.", exKo:"광화학 반응이 빛을 전기 충격으로 변형시킨다.",
    derived:[], syn:[["convert","변형시키다"]] },
]};

/* ===== 저장 (이 휴대폰 안에 저장) ===== */
const ls = {
  get(k,d){ try{ const v=localStorage.getItem('vocab_'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('vocab_'+k, JSON.stringify(v)); return true; }catch(e){ toast('저장 공간이 부족해요'); return false; } }
};
let sets = ls.get('sets', null);
if(!Array.isArray(sets)){ sets = [{id:'s_starter', day:STARTER.day, created:Date.now(), words:STARTER.words}]; ls.set('sets', sets); }
let known = ls.get('known', {});
let mode = ls.get('mode','study');
let day = ls.get('day','전체');
let onlyUnknown = false, shuffled = false, order = {};
const revealed = new Set();
const saveSets = () => ls.set('sets', sets);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const exHtml = s => esc(s).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>');
const keyOf = w => w.day + '|' + w.word;

function allWords(){ return sets.flatMap(s => (s.words||[]).map((w,i) => ({...w, day:s.day, _uid:s.id+'#'+i}))); }
function dayNames(){
  const n = []; sets.forEach(s => { if(!n.includes(s.day)) n.push(s.day); });
  return n.sort((a,b)=>a.localeCompare(b,'ko',{numeric:true}));
}
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2600);
}
function hid(id, html){
  const cover = mode==='test' && !revealed.has(id);
  return `<span class="hid${cover?' cover':''}" data-id="${esc(id)}">${html}</span>`;
}

/* ===== 화면 ===== */
function render(){
  document.body.classList.toggle('test', mode==='test');
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on', b.dataset.mode===mode));
  const names = dayNames();
  if(day!=='전체' && !names.includes(day)) day='전체';
  document.getElementById('days').innerHTML = ['전체', ...names].map(d=>`<button class="chip${d===day?' on':''}" data-day="${esc(d)}">${esc(d)}</button>`).join('');

  let words = allWords().filter(w => day==='전체' || w.day===day);
  const total = words.length, done = words.filter(w=>known[keyOf(w)]).length;
  document.getElementById('stats').textContent = `${total}단어 · 외움 ${done} · 남음 ${total-done}`;
  if(onlyUnknown) words = words.filter(w=>!known[keyOf(w)]);
  if(shuffled) words.sort((a,b)=>(order[a._uid]??0)-(order[b._uid]??0));

  const t = [];
  if(mode==='test'){
    t.push(`<button class="tool" data-act="hideall">🙈 다시 가리기</button>`);
    t.push(`<button class="tool" data-act="showall">👀 모두 보기</button>`);
  }
  t.push(`<button class="tool${shuffled?' on':''}" data-act="shuffle">🔀 섞기</button>`);
  t.push(`<button class="tool${onlyUnknown?' on':''}" data-act="unknown">❗ 못 외운 것만</button>`);
  if(mode==='study' && day!=='전체') t.push(`<button class="tool danger" data-act="delday">🗑 ${esc(day)} 삭제</button>`);
  document.getElementById('tools').innerHTML = t.join('');
  document.getElementById('hint').textContent = mode==='test'
    ? '가려진 뜻을 터치하면 보이고, 다시 터치하면 가려져요. 영단어를 터치하면 그 카드 전체가 열려요.' : '';

  const list = document.getElementById('list');
  if(!words.length){
    list.innerHTML = onlyUnknown
      ? `<div class="empty">🎉 모두 외웠어요!<br>‘못 외운 것만’을 끄면 전체가 보여요.</div>`
      : `<div class="empty">단어가 없어요.<br>위의 <b>➕ 단어 추가</b>를 눌러 보세요.</div>`;
    return;
  }
  list.innerHTML = words.map(w=>{
    const k = keyOf(w), u = w._uid;
    const derived = (w.derived||[]).length ? `<div class="sec"><h4>파생어 · 관련어</h4>${
      w.derived.map((d,i)=>`<div class="row"><span class="w">${esc(d[0])}</span><span class="m">${hid(u+'|d'+i, esc(d[1]))}</span></div>`).join('')}</div>` : '';
    const syn = (w.syn||[]).length ? `<div class="sec"><h4>유의어</h4><div class="synbox syn">${
      w.syn.map((s,i)=>`<div class="row"><span class="w"><span class="badge">유</span>${esc(s[0])}</span><span class="m">${hid(u+'|s'+i, esc(s[1]))}</span></div>`).join('')}</div></div>` : '';
    const ex = w.ex ? `<div class="ex">${exHtml(w.ex)}${w.exKo?`<span class="ko">${hid(u+'|e', esc(w.exKo))}</span>`:''}</div>` : '';
    return `<article class="card${known[k]?' done':''}">
      <div class="top">
        <div data-open="${esc(u)}" style="cursor:pointer">
          <span class="num">${w.no?esc(w.no)+' · ':''}${esc(w.day)}</span>
          <div class="word">${esc(w.word)}</div>
          ${w.ph?`<div class="ph">${esc(w.ph)}</div>`:''}
        </div>
        <button class="check${known[k]?' on':''}" data-known="${esc(k)}">${known[k]?'✓ 외움':'외웠어요'}</button>
      </div>
      <div class="mean">${w.pos?`<span class="pos">${esc(w.pos)}</span>`:''}${hid(u+'|m', esc(w.mean))}</div>
      ${ex}${derived}${syn}
    </article>`;
  }).join('');
}
function idsFor(u){
  const w = allWords().find(x=>x._uid===u); if(!w) return [];
  return [u+'|m', u+'|e', ...(w.derived||[]).map((_,i)=>u+'|d'+i), ...(w.syn||[]).map((_,i)=>u+'|s'+i)];
}

/* ===== 단어 코드 읽기 ===== */
function clean(arr){ return (Array.isArray(arr)?arr:[]).filter(p=>Array.isArray(p)&&p[0]).map(p=>[String(p[0]), String(p[1]??'')]); }
function normWord(w){
  return { no:String(w.no||''), word:String(w.word).trim(), ph:String(w.ph||''), pos:String(w.pos||'').slice(0,3),
    mean:String(w.mean||''), ex:String(w.ex||''), exKo:String(w.exKo||''), derived:clean(w.derived), syn:clean(w.syn) };
}
function parseCode(text){
  let s = String(text||'').trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/); if(fence) s = fence[1];
  const a = s.search(/[\[{]/), b = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
  if(a<0 || b<a) throw new Error('단어 코드를 찾지 못했어요');
  const data = JSON.parse(s.slice(a,b+1));
  // 백업 파일
  if(data && Array.isArray(data.sets)) return {backup:data};
  const list = Array.isArray(data) ? data : (Array.isArray(data.days) ? data.days : [data]);
  const out = list.filter(d=>d && Array.isArray(d.words)).map(d=>({
    day:String(d.day||'').trim(), words:d.words.filter(w=>w&&w.word).map(normWord)
  })).filter(d=>d.words.length);
  if(!out.length) throw new Error('코드 안에 단어가 없어요');
  return {days:out};
}
function nextDayName(){
  let n = 1; const names = dayNames();
  while(names.includes('DAY ' + String(n).padStart(2,'0'))) n++;
  return 'DAY ' + String(n).padStart(2,'0');
}

/* ===== 아래에서 올라오는 창 ===== */
const sheetBg = document.getElementById('sheetBg'), sheet = document.getElementById('sheet');
let pending = null, fileMode = 'add';
function openSheet(html){ sheet.innerHTML = html; sheetBg.classList.add('open'); }
function closeSheet(){ sheetBg.classList.remove('open'); sheet.innerHTML=''; pending=null; }
sheetBg.addEventListener('click', e=>{ if(e.target===sheetBg) closeSheet(); });

function openAdd(){
  openSheet(`
    <h2>단어 추가</h2>
    <p class="s">Claude에게 단어책 사진을 보내고 받은 <b>단어 코드</b>를 아래에 붙여넣으세요.<br>단어 코드 파일(.json)을 받았다면 ‘파일에서 불러오기’를 누르세요.</p>
    <textarea id="code" placeholder='{"day":"DAY 05","words":[ ... ]}'></textarea>
    <div class="err" id="err"></div>
    <div class="btns"><button class="btn" data-sheet="file">📂 파일에서 불러오기</button><button class="btn" data-sheet="paste">📋 붙여넣기</button></div>
    <div class="btns"><button class="btn" data-sheet="cancel">취소</button><button class="btn pri" data-sheet="read">다음</button></div>`);
}
function readInput(text){
  try{
    const r = parseCode(text);
    if(r.backup){ confirmRestore(r.backup); return; }
    pending = r.days.map(d=>({day:d.day || nextDayName(), words:d.words}));
    renderPreview();
  }catch(e){
    const el = document.getElementById('err');
    const msg = e instanceof SyntaxError ? '코드가 중간에 잘린 것 같아요. 처음부터 끝까지 전부 복사해 주세요.' : e.message;
    if(el) el.textContent = msg; else toast(msg);
  }
}
function renderPreview(){
  const total = pending.reduce((a,d)=>a+d.words.length,0);
  openSheet(`
    <h2>단어 ${total}개</h2>
    <p class="s">틀린 단어는 ✕로 빼고 저장하세요. 같은 DAY 이름이 이미 있으면 그 DAY에 이어서 붙어요.</p>
    ${pending.map((d,di)=>`
      <div class="field"><label>DAY 이름</label><input data-dayname="${di}" value="${esc(d.day)}"></div>
      ${d.words.map((w,i)=>`<div class="pv"><div class="t"><b>${esc(w.word)}</b> ${esc(w.ph)}<br>${esc(w.mean)}${
        w.derived.length?`<br>▪ ${w.derived.map(x=>esc(x[0])).join(', ')}`:''}${
        w.syn.length?`<br>유 ${w.syn.map(x=>esc(x[0])).join(', ')}`:''}</div><button class="x" data-rm="${di}:${i}">✕</button></div>`).join('')}
    `).join('')}
    <div class="btns"><button class="btn" data-sheet="cancel">취소</button><button class="btn pri" data-sheet="save" ${total?'':'disabled'}>단어장에 저장</button></div>`);
}
function syncDayNames(){ sheet.querySelectorAll('[data-dayname]').forEach(inp=>{ pending[+inp.dataset.dayname].day = inp.value.trim() || nextDayName(); }); }

function savePending(){
  syncDayNames();
  let added = 0, skipped = 0, lastDay = null;
  pending.forEach(d=>{
    const existing = new Set(allWords().filter(w=>w.day===d.day).map(w=>w.word.toLowerCase()));
    const fresh = d.words.filter(w=>{ const k=w.word.toLowerCase(); if(existing.has(k)){ skipped++; return false; } existing.add(k); return true; });
    if(fresh.length){ sets.push({id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), day:d.day, created:Date.now(), words:fresh}); added += fresh.length; lastDay = d.day; }
  });
  if(!saveSets()) return;
  closeSheet();
  if(lastDay){ day = lastDay; ls.set('day', day); }
  mode = 'study'; ls.set('mode', mode); render();
  toast(added ? `${added}단어를 저장했어요` + (skipped?` (이미 있는 ${skipped}개는 건너뜀)`:'') : '이미 모두 들어 있는 단어예요');
}

/* ===== 백업 ===== */
function openMenu(){
  openSheet(`<div class="menu">
    <h2>설정</h2>
    <p class="s">단어는 이 휴대폰 안에만 저장돼요. 앱을 지우거나 크롬의 사이트 데이터를 지우면 사라지니, 가끔 백업 파일을 저장해 두세요.</p>
    <button class="btn" data-sheet="backup">💾 백업 파일 저장</button>
    <button class="btn" data-sheet="restore">📂 백업 파일 불러오기</button>
    <button class="btn" data-sheet="resetknown">↺ ‘외웠어요’ 체크 모두 지우기</button>
    <div class="btns"><button class="btn" data-sheet="cancel">닫기</button></div></div>`);
}
function backup(){
  const data = JSON.stringify({app:'vocab', version:1, saved:new Date().toISOString(), sets, known}, null, 1);
  const name = `단어장백업_${new Date().toISOString().slice(0,10)}.json`;
  const blob = new Blob([data], {type:'application/json'});
  const file = new File([blob], name, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:name}).catch(()=>{});
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    toast('다운로드 폴더에 저장했어요');
  }
}
function confirmRestore(data){
  const n = data.sets.reduce((a,s)=>a+(s.words||[]).length,0);
  pending = data;
  openSheet(`<h2>백업 불러오기</h2>
    <p class="s">백업에 ${data.sets.length}개 묶음, ${n}단어가 있어요.<br>지금 단어장을 <b>백업 내용으로 바꿉니다.</b></p>
    <div class="btns"><button class="btn" data-sheet="cancel">취소</button><button class="btn pri" data-sheet="dorestore">바꾸기</button></div>`);
}

/* ===== 버튼 처리 ===== */
document.getElementById('addBtn').onclick = openAdd;
document.getElementById('menuBtn').onclick = openMenu;
const fileInput = document.getElementById('file');
fileInput.onchange = async e => {
  const f = e.target.files && e.target.files[0]; e.target.value=''; if(!f) return;
  const text = await f.text();
  readInput(text);
};

let confirmReset = false;
sheet.addEventListener('click', async e=>{
  const b = e.target.closest('[data-sheet],[data-rm]'); if(!b) return;
  if(b.dataset.rm){ syncDayNames(); const [di,i] = b.dataset.rm.split(':').map(Number); pending[di].words.splice(i,1); if(!pending[di].words.length) pending.splice(di,1); pending.length ? renderPreview() : closeSheet(); return; }
  const a = b.dataset.sheet;
  if(a==='cancel') closeSheet();
  if(a==='file') fileInput.click();
  if(a==='paste'){
    try{ const t = await navigator.clipboard.readText(); document.getElementById('code').value = t; }
    catch(err){ toast('입력칸을 길게 눌러 붙여넣기 해 주세요'); }
  }
  if(a==='read') readInput(document.getElementById('code').value);
  if(a==='save') savePending();
  if(a==='backup') backup();
  if(a==='restore') fileInput.click();
  if(a==='dorestore'){
    const d = pending;
    sets = d.sets.filter(s=>s&&Array.isArray(s.words)).map(s=>({id:String(s.id||('s_'+Math.random().toString(36).slice(2))), day:String(s.day||'DAY ?'), created:s.created||Date.now(), words:s.words.filter(w=>w&&w.word).map(normWord)}));
    known = (d.known && typeof d.known==='object') ? d.known : {};
    saveSets(); ls.set('known', known); day='전체'; closeSheet(); render(); toast('백업을 불러왔어요');
  }
  if(a==='resetknown'){
    if(!confirmReset){ confirmReset = true; b.textContent = '한 번 더 누르면 지워져요'; setTimeout(()=>confirmReset=false, 3000); return; }
    known = {}; ls.set('known', known); closeSheet(); render(); toast('체크를 모두 지웠어요');
  }
});

let confirmDel = null;
document.addEventListener('click', e=>{
  if(e.target.closest('#sheetBg')) return;
  const el = e.target.closest('[data-mode],[data-day],[data-act],[data-known],[data-open],.hid');
  if(!el) return;
  if(el.dataset.mode){ mode = el.dataset.mode; ls.set('mode',mode); revealed.clear(); render(); return; }
  if(el.dataset.day){ day = el.dataset.day; ls.set('day',day); render(); return; }
  if(el.dataset.known){ const k=el.dataset.known; if(known[k]) delete known[k]; else known[k]=true; ls.set('known', known); render(); return; }
  if(el.dataset.act){
    const a = el.dataset.act;
    if(a==='hideall') revealed.clear();
    if(a==='showall') allWords().forEach(w=>idsFor(w._uid).forEach(i=>revealed.add(i)));
    if(a==='unknown') onlyUnknown=!onlyUnknown;
    if(a==='shuffle'){ shuffled=!shuffled; order={}; allWords().forEach(w=>order[w._uid]=Math.random()); }
    if(a==='delday'){
      if(confirmDel!==day){ confirmDel=day; toast(`한 번 더 누르면 ${day}가 삭제돼요`); setTimeout(()=>confirmDel=null, 3000); return; }
      confirmDel=null; const name=day; sets = sets.filter(s=>s.day!==name); saveSets(); day='전체'; toast(`${name}를 삭제했어요`);
    }
    render(); return;
  }
  if(mode!=='test') return;
  if(el.dataset.open){
    const ids = idsFor(el.dataset.open); const allOpen = ids.every(i=>revealed.has(i));
    ids.forEach(i=> allOpen ? revealed.delete(i) : revealed.add(i)); render(); return;
  }
  if(el.classList.contains('hid')){
    const id = el.dataset.id; revealed.has(id) ? revealed.delete(id) : revealed.add(id);
    el.classList.toggle('cover', !revealed.has(id));
  }
});

render();

/* 설치 & 오프라인 */
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
</script>
